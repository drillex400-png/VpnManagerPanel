services:
  backend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_deps:/app/node_modules
      - xray_binaries:/app/.xray-bin
      - xray_configs:/app/.xray-configs
      - xray_data:/app/.xray-data
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - BASE44_PREVIEW_MODE
      - XRAY_BIN_DIR=/app/.xray-bin
      - XRAY_CFG_DIR=/app/.xray-configs
      - XRAY_DATA_DIR=/app/.xray-data
    command: ["sh", "-c", "npm install && exec npx tsx watch src/index.ts"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: on-failure

  frontend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_deps:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - BACKEND_URL=http://backend:3001
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-c", "npm install && exec npx vite --host 0.0.0.0 --port 5173"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: on-failure
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_deps:
  frontend_deps:
  xray_binaries:
  xray_configs:
  xray_data:
